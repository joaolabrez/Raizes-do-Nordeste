<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="barra-superior"> 
    <h1>Raízes do Nordeste</h1>
    <nav>
        <a href="html/login.html">Login</a>
        <a href="html/cadastra.html">Cadastrar</a> 
    </nav>
</header>
    <main>
        <h1>Raízes do Nordeste</h1>
        <p>O verdadeiro sabor do cuscuz e da tapioca</p>
        <div class="cardapio">

            <div class="produto-item">
                <h3>Tapioca de Carne do Sol</h3>
                <p class="preco">R$ 18,00</p>
                <button type="button">Adicionar ao Carrinho</button>
            </div>

            <div class="produto-item">
                <h3>Cuscuz</h3>
                <p class="preco">R$ 10,00</p>
                <button type="button">Adicionar ao Carrinho</button>
            </div>

            <div class="produto-item">
                <h3>Mortandela</h3>
                <p class="preco">R$ 8,00</p>
                <button type="button">Adicionar ao Carrinho</button>
            </div>
        </div>
    </main>
    <footer>
    <div class="seletor-unidade">
        <label for="unidade">Escolha a unidade mais próxima:</label>
        <select id="unidade" name="unidade">
            <option value="recife">Recife</option>
            <option value="caruaru">Caruaru</option>
            <option value="fortaleza">Fortaleza</option>
        </select>
    </div>
</footer>
