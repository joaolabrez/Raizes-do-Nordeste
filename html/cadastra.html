<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Cadastrar</title>
</head>
<body>
    <form name="cadastra_form" method="post" action="login.html">
        <label for="Nome">Nome Completo:</label>
        <input type="text" id="Nome" name="Nome" placeholder="Digite seu nome" required>
        
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="Digite seu email" required>
        
        <label for="contato">Contato:</label>
        <input type="number" id="contato" name="Contato" placeholder="Digite seu contato" required>
        
        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" name="DataNascimento" required>

        <label for="login">Login:</label>
        <input type="text" id="login" name="login" placeholder="Digite seu login " required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
        <label for="confirm_password">Confirmar Senha:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Digite sua senha novamente" required>

        <div class="container-lgpd">
            <input type="checkbox" id="lgpd" required>
            <label for="lgpd">Aceito os termos de privacidade e uso de dados conforme a LGPD.</label>
        </div>

        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
