<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Cadastrar</title>
</head>
<body>
<div class="cadastro-wrapper">
    <div class="cadastro-container">
        
        <div class="cadastro-info-lateral">
            <div class="info-conteudo">
                <h1>Raízes do Nordeste</h1>
                <p>O verdadeiro sabor do cuscuz e da tapioca agora a um clique de você.</p>
                <div class="decoracao-nordeste">🌵 ✨ 🥞</div>
            </div>
        </div>

        <div class="cadastro-card">
            <h2>Criar Conta</h2>
            <p class="cadastro-subtitulo">Preencha os campos para se cadastrar</p>

            <form name="cadastra_form" method="get" action="login.html">
                
                <div class="campo-grupo">
                    <label for="Nome">Nome Completo:</label>
                    <input type="text" id="Nome" name="Nome" placeholder="Digite seu nome" required>
                </div>
                
                <div class="campo-grupo">
                    <label for="Email">Email:</label>
                    <input type="email" id="Email" name="Email" placeholder="Digite seu email" required>
                </div>
                
                <div class="linha-campos">
                    <div class="campo-grupo">
                        <label for="contato">Contato:</label>
                        <input type="number" id="contato" name="Contato" placeholder="(81) 99999-9999" required>
                    </div>
                    
                    <div class="campo-grupo">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" name="DataNascimento" required>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="login">Login:</label>
                    <input type="text" id="login" name="login" placeholder="Escolha um usuário" required>
                </div>

                <div class="linha-campos">
                    <div class="campo-grupo">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>

                    <div class="campo-grupo">
                        <label for="confirm_password">Confirmar Senha:</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
                    </div>
                </div>

                <div class="container-lgpd">
                    <input type="checkbox" id="lgpd" required>
                    <label for="lgpd">Aceito os termos de privacidade e uso de dados conforme a LGPD.</label>
                </div>

                <input type="submit" value="Cadastrar" class="botao-cadastro">
            </form>
            
            <p class="link-alternativo">Já tem conta? <a href="login.html">Faça login aqui</a></p>
        </div>

    </div>
</div>
<script src="../js/scripts.js"></script>
</body>
</html>
