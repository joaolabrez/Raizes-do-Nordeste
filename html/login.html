<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Login</title>
</head>
<body>
    <form name="login_form" method="post" action="index.html">
        <label for="login">Login:</label>
        <input type="text" id="login" name="login" placeholder="Digite seu login" required>
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
        <div class="container-lgpd">
            <input type="checkbox" id="lgpd" required>
            <label for="lgpd">Aceito os termos de privacidade e uso de dados conforme a LGPD.</label>
        </div>
        <input type="submit" value="Entrar">
    </form>
</body>
</html>
